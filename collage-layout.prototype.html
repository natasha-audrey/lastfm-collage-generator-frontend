<!doctype html>
<!-- Throwaway: three collage layouts, switchable with ?variant=A/B/C. Mock responses only. -->
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Collage layout prototype</title>
<style>
body[data-variant=A] header,body[data-variant=A] h1,body[data-variant=A] .intro{display:none}*{box-sizing:border-box}body{margin:0;background:#faf9f6;color:#242520;font:16px system-ui,sans-serif}button,input,select{font:inherit}button,select{cursor:pointer}button,input,select{min-height:46px;border:1px solid #c9cbc4;border-radius:8px;padding:10px 14px;background:white;color:inherit}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #5a775c;outline-offset:3px}button:disabled,input:disabled,select:disabled{cursor:wait;opacity:.6}header{padding:25px 32px;font-weight:650;letter-spacing:-.5px}header span{color:#777b70;font-size:12px;font-weight:400;letter-spacing:1px;margin-left:12px}main{max-width:760px;margin:12vh auto 150px;padding:0 24px;text-align:center}h1{font-size:44px;font-weight:550;letter-spacing:-2px;margin:0 0 12px}.intro{color:#727669;margin:0 0 32px}form{text-align:left}fieldset{border:0;padding:0;margin:0;display:grid;grid-template-columns:1fr 1fr auto;gap:16px;align-items:end}label{display:flex;flex-direction:column;gap:8px;font-size:13px;font-weight:550}.username{grid-column:1/-1}.username input{font-size:18px;min-height:60px;border-radius:30px;padding:16px 24px}.primary{background:#304c38;color:white;border-color:#304c38;font-weight:600}.message{min-height:24px;margin:18px 0;color:#656b5e;font-size:14px}.message.error{color:#a3362b}#result{margin:28px auto 0;max-width:620px}#result img{width:100%;display:block}body[data-variant=B] main{background:white;border:1px solid #d8d9d2;padding:38px;max-width:620px;margin-top:5vh;border-radius:16px}body[data-variant=B] h1{text-align:left;font-size:34px}body[data-variant=B] .intro{text-align:left}body[data-variant=B] fieldset{grid-template-columns:1fr 1fr}body[data-variant=B] .primary{grid-column:1/-1}body[data-variant=B] .username input{border-radius:8px}body[data-variant=C]{background:#f1f0e9}body[data-variant=C] main{max-width:1040px;margin-top:5vh}body[data-variant=C] h1{font:italic 56px Georgia,serif;letter-spacing:-2px}body[data-variant=C] fieldset{grid-template-columns:2fr 1fr 1fr auto;background:white;padding:20px;border-top:2px solid #304c38}body[data-variant=C] .username{grid-column:auto}body[data-variant=C] .username input{border-radius:4px;min-height:46px;font-size:16px;padding:10px 14px}.tools{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);width:max-content;max-width:calc(100% - 20px);background:#232920;color:#fff;padding:10px 14px;border-radius:14px;font-size:12px;z-index:2}.switcher{display:flex;align-items:center;justify-content:center;gap:12px}.tools button,.tools select{min-height:32px;padding:4px 8px;font-size:12px;background:#394335;color:white;border-color:#66735f}.simulation{display:flex;gap:8px;align-items:center;margin-top:8px;flex-wrap:wrap;justify-content:center}#state{display:block;text-align:center;margin-top:8px;color:#ccd3c5;font:11px monospace}body.narrow main{max-width:375px;padding:20px}body.narrow fieldset{display:flex;flex-direction:column;align-items:stretch}body.narrow h1{font-size:32px}body.narrow .username input{width:100%}@media(max-width:600px){header{padding:20px}main,body[data-variant=B] main,body[data-variant=C] main{margin:5vh 12px 180px;padding:16px}h1,body[data-variant=C] h1{font-size:36px}fieldset,body[data-variant=C] fieldset{display:flex;flex-direction:column;align-items:stretch}.username input{width:100%}.tools{width:calc(100% - 20px)}}
</style>
<body><header>last.fm collage <span>YOUR LISTENING, PICTURED</span></header><main><h1>Your week in music.</h1><p class="intro">Turn your most-played albums into a collage.</p><form><fieldset><label class="username">Last.fm username<input name="username" autocomplete="off" placeholder="Your Last.fm username" aria-describedby="message"></label><label>Listening period<select name="period"><option>Last 7 days</option><option>Last month</option><option>Last 3 months</option><option>Last 6 months</option><option>Last 12 months</option><option>All time</option></select></label><label>Grid size<select name="size"><option>3 × 3</option><option>4 × 4</option><option selected>5 × 5</option><option>6 × 6</option><option>7 × 7</option><option>8 × 8</option><option>9 × 9</option><option>10 × 10</option></select></label><button class="primary">Generate</button></fieldset></form><div class="message" id="message" role="status" aria-live="polite"></div><div id="result"></div></main>
<aside class="tools" aria-label="Prototype controls"><div class="switcher"><button id="prev" aria-label="Previous layout">←</button><strong id="variant"></strong><button id="next" aria-label="Next layout">→</button><button id="narrow" aria-pressed="false">Narrow view</button></div><div class="simulation"><span>Mock next response</span><select id="response" aria-label="Mock next response"><option value="success">Success</option><option value="partial">Partial grid / fallback</option><option value="unknown">Unknown user</option><option value="empty">No albums</option><option value="busy">Service busy</option><option value="temporary">Temporary failure</option></select><button id="reset">Reset</button></div><output id="state"></output></aside>
<script>
const form=document.querySelector('form'),fields=document.querySelector('fieldset'),message=document.querySelector('#message'),result=document.querySelector('#result');
let variant=new URLSearchParams(location.search).get('variant')||'A',status='idle',hasImage=false,timer,sequence=0;
const names={A:'Centered search',B:'Compact panel',C:'Wide workbench'};
function surface(){document.querySelector('#state').textContent=`THROWAWAY • ${status} • previous image: ${hasImage?'yes':'no'} • mock data`;}
function showVariant(v){variant=names[v]?v:'A';document.body.dataset.variant=variant;document.querySelector('#variant').textContent=`${variant} · ${names[variant]}`;const url=new URL(location);url.searchParams.set('variant',variant);history.replaceState(null,'',url);surface();}
function cycle(d){showVariant(['A','B','C'][(['A','B','C'].indexOf(variant)+d+3)%3]);}document.querySelector('#prev').onclick=()=>cycle(-1);document.querySelector('#next').onclick=()=>cycle(1);document.addEventListener('keydown',e=>{if(e.target.closest('input,textarea,select,button,[contenteditable]'))return;if(['ArrowLeft','ArrowRight'].includes(e.key)){e.preventDefault();cycle(e.key==='ArrowLeft'?-1:1);}});
document.querySelector('#narrow').onclick=e=>{document.body.classList.toggle('narrow');e.target.setAttribute('aria-pressed',document.body.classList.contains('narrow'));};
function artwork(n,partial){const canvas=document.createElement('canvas');canvas.width=canvas.height=900;const ctx=canvas.getContext('2d'),palette=['#333e39','#9e503c','#c6b681','#66798a','#d5a075','#27262c','#777657'];for(let i=0;i<n*n;i++){let x=i%n*900/n,y=Math.floor(i/n)*900/n,s=900/n;ctx.fillStyle=palette[(i+sequence)%palette.length];ctx.fillRect(x,y,s,s);if(partial&&i>=n*n-3){ctx.fillStyle='#bcbcb2';ctx.fillRect(x,y,s,s);continue;}ctx.save();ctx.beginPath();ctx.rect(x,y,s,s);ctx.clip();ctx.fillStyle=palette[(i+sequence+3)%palette.length];if(i%3===0){ctx.beginPath();ctx.arc(x+s*.5,y+s*.4,s*.35,0,Math.PI*2);ctx.fill();}else if(i%3===1){ctx.translate(x+s/2,y+s/2);ctx.rotate(.5);ctx.fillRect(-s*.2,-s,s*.4,s*2);}else{for(let j=0;j<5;j++)ctx.fillRect(x,y+j*s/5,s,s/12);}ctx.restore();ctx.fillStyle='#ffffffdd';ctx.font=`${s/12}px sans-serif`;ctx.fillText(['AFTER HOURS','SLOW MOTION','OTHER PLACES','BLUE ROOM','IN BLOOM'][i%5],x+s*.08,y+s*.9);}return canvas.toDataURL();}
form.onsubmit=e=>{e.preventDefault();if(status==='loading')return;form.username.value=form.username.value.trim();form.username.removeAttribute('aria-invalid');if(!form.username.value){message.textContent='Enter your Last.fm username.';message.className='message error';form.username.setAttribute('aria-invalid','true');form.username.focus();status='validation';surface();return;}const response=document.querySelector('#response').value,n=parseInt(form.size.value);fields.disabled=true;status='loading';message.className='message';message.textContent='Generating collage…';surface();timer=setTimeout(()=>{fields.disabled=false;if(['success','partial'].includes(response)){sequence++;const img=new Image();img.alt='Sample collage with abstract placeholder album artwork';img.src=artwork(n,response==='partial');result.replaceChildren(img);hasImage=true;status='success';message.textContent='';}else{status='error';message.className='message error';message.textContent={unknown:'That Last.fm user could not be found. Check the username and try again.',empty:'No albums found for this listening period. Try a different period.',busy:'The collage service is busy. Try Generate again shortly.',temporary:'Something interrupted generation. Select Generate to try again.'}[response];}surface();},1800);};
document.querySelector('#reset').onclick=()=>{clearTimeout(timer);fields.disabled=false;form.reset();form.username.removeAttribute('aria-invalid');result.replaceChildren();message.textContent='';status='idle';hasImage=false;surface();};showVariant(variant);
</script></body></html>
